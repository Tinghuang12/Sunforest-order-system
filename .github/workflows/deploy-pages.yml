name: Deploy 台股顧問 App to GitHub Pages

on:
  push:
    paths:
      - "apps/tw-stock-advisor/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 解析器測試
        run: npm test
        working-directory: apps/tw-stock-advisor

  deploy:
    # 只從預設分支部署，避免多個分支互相覆蓋。
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/tw-stock-advisor
      - id: deployment
        uses: actions/deploy-pages@v4
